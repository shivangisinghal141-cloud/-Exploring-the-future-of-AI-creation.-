<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glaude — Your Study Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1F3A34;
    --board-deep:#16241F;
    --chalk:#F5F1E8;
    --sage:#7FA394;
    --marigold:#E8A33D;
    --marigold-deep:#C97F1F;
    --paper:#FBF9F4;
    --paper-line: rgba(31,58,52,0.10);
    --ink:#1C2723;
    --ink-soft:#4E5D57;
    --danger:#C0553F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Public Sans', -apple-system, sans-serif;
    background:var(--board-deep);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:760px;
    height:min(720px, 92vh);
    background:var(--paper);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    box-shadow:0 40px 90px rgba(0,0,0,0.45);
    position:relative;
  }

  /* Spiral binder edge — the signature element */
  .binder{
    width:34px;
    flex-shrink:0;
    background:var(--board);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    padding:18px 0;
  }
  .ring{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--board-deep);
    border:2px solid var(--sage);
    opacity:0.85;
  }

  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* Header = classroom nameplate */
  .head{
    background:var(--board);
    color:var(--chalk);
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--marigold);
  }
  .head-left{ display:flex; align-items:center; gap:12px; }
  .badge{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--marigold);
    color:var(--board-deep);
    font-family:'Newsreader', serif;
    font-weight:600;
    font-style:italic;
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .head h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:20px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .head p{
    margin:2px 0 0;
    font-size:12px;
    color:rgba(245,241,232,0.65);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.02em;
  }
  .reset-btn{
    background:none; border:1px solid rgba(245,241,232,0.3);
    color:rgba(245,241,232,0.75);
    font-size:12px; font-family:'IBM Plex Mono', monospace;
    padding:7px 12px; border-radius:5px; cursor:pointer;
    transition:all .15s;
  }
  .reset-btn:hover{ border-color:var(--marigold); color:var(--marigold); }

  /* Chat area = ruled notebook page */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:26px 26px 10px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 31px,
      var(--paper-line) 32px
    );
    background-position: 0 8px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .chat::-webkit-scrollbar{ width:8px; }
  .chat::-webkit-scrollbar-thumb{ background:var(--paper-line); border-radius:4px; }

  .row{ display:flex; gap:10px; max-width:88%; }
  .row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .row.bot{ align-self:flex-start; }

  .avatar{
    width:30px; height:30px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600;
    margin-top:2px;
  }
  .row.bot .avatar{ background:var(--board); color:var(--marigold); }
  .row.user .avatar{ background:var(--sage); color:var(--board-deep); }

  /* Student message = sticky note */
  .bubble{
    padding:12px 16px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .row.user .bubble{
    background:#FFF3C4;
    border:1px solid #E8D68A;
    border-radius:3px 10px 10px 10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
    color:#4A3C10;
  }

  /* Glaude message = chalk writing on a slate panel */
  .row.bot .bubble{
    background:var(--board);
    color:var(--chalk);
    border-radius:4px 14px 14px 4px;
    position:relative;
  }
  .row.bot .bubble::before{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 4px 4px;
    pointer-events:none;
  }
  .bubble strong{ color:var(--marigold-bright, var(--marigold)); }
  .bubble code{
    font-family:'IBM Plex Mono', monospace;
    background:rgba(255,255,255,0.08);
    padding:1px 5px;
    border-radius:3px;
    font-size:0.92em;
  }
  .row.user .bubble code{ background:rgba(0,0,0,0.08); }
  .bubble pre{
    font-family:'IBM Plex Mono', monospace;
    background:rgba(255,255,255,0.07);
    padding:12px 14px;
    border-radius:6px;
    overflow-x:auto;
    font-size:13px;
    margin:8px 0 0;
  }

  .typing{
    display:flex; gap:5px; padding:14px 16px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--marigold);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  .intro{
    text-align:center;
    padding:30px 20px 6px;
    color:var(--ink-soft);
  }
  .intro h2{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-style:italic;
    font-size:22px;
    color:var(--board);
    margin:0 0 6px;
  }
  .intro p{ font-size:13.5px; margin:0; max-width:380px; margin:0 auto; }
  .chips{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top:18px;
  }
  .chip{
    font-size:12.5px; font-family:'IBM Plex Mono', monospace;
    background:var(--paper); border:1px solid var(--paper-line);
    color:var(--ink-soft);
    padding:8px 13px; border-radius:20px; cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{ border-color:var(--marigold); color:var(--marigold-deep); background:#FFF8EA; }

  .error-note{
    align-self:center;
    font-size:13px;
    color:var(--danger);
    background:rgba(192,85,63,0.08);
    border:1px solid rgba(192,85,63,0.25);
    padding:8px 14px;
    border-radius:6px;
    max-width:90%;
  }

  /* Input tray */
  .input-tray{
    border-top:1px solid var(--paper-line);
    background:var(--paper);
    padding:14px 20px 18px;
  }
  .input-row{
    display:flex; align-items:flex-end; gap:10px;
    background:#fff;
    border:1.5px solid var(--paper-line);
    border-radius:12px;
    padding:8px 8px 8px 16px;
    transition:border-color .15s;
  }
  .input-row:focus-within{ border-color:var(--marigold); }
  textarea{
    flex:1; border:none; outline:none; resize:none;
    font-family:'Public Sans', sans-serif;
    font-size:14.5px;
    line-height:1.5;
    max-height:120px;
    padding:8px 0;
    background:transparent;
    color:var(--ink);
  }
  textarea::placeholder{ color:var(--ink-soft); opacity:0.6; }
  .send-btn{
    width:38px; height:38px;
    border-radius:9px;
    border:none;
    background:var(--marigold);
    color:var(--board-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:background .15s, transform .1s;
  }
  .send-btn:hover{ background:var(--marigold-deep); }
  .send-btn:active{ transform:scale(0.94); }
  .send-btn:disabled{ background:#DCD6C8; color:#a39d8f; cursor:default; }
  .hint{
    text-align:center; font-size:11px; color:var(--ink-soft); opacity:0.55;
    margin-top:8px; font-family:'IBM Plex Mono', monospace;
  }

  @media (max-width:600px){
    body{ padding:0; }
    .app{ height:100vh; max-width:100%; border-radius:0; }
    .binder{ width:20px; }
    .ring{ width:10px; height:10px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="binder" id="binder"></div>
  <div class="main">
    <div class="head">
      <div class="head-left">
        <div class="badge">G</div>
        <div>
          <h1>Glaude</h1>
          <p>your patient study buddy</p>
        </div>
      </div>
      <button class="reset-btn" id="resetBtn">New chat</button>
    </div>

    <div class="chat" id="chat">
      <div class="intro" id="intro">
        <h2>What are you stuck on today?</h2>
        <p>Paste a problem, ask about a concept, or just say where you got confused — I'll break it down step by step.</p>
        <div class="chips">
          <button class="chip" data-msg="Can you explain photosynthesis like I'm in 8th grade?">explain photosynthesis simply</button>
          <button class="chip" data-msg="I'm stuck on this: solve for x in 2x + 5 = 17, and explain each step.">help me solve an equation</button>
          <button class="chip" data-msg="What's the difference between mitosis and meiosis?">mitosis vs meiosis</button>
          <button class="chip" data-msg="Can you explain Newton's second law with an everyday example?">Newton's second law</button>
        </div>
      </div>
    </div>

    <div class="input-tray">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Ask Glaude anything you're stuck on..."></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>
</div>

<script>
  // Spiral binder rings
  const binder = document.getElementById('binder');
  for(let i=0;i<12;i++){
    const r = document.createElement('div');
    r.className = 'ring';
    binder.appendChild(r);
  }

  const chat = document.getElementById('chat');
  const intro = document.getElementById('intro');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');

  let history = [];

  const SYSTEM_PROMPT = `You are Glaude, a warm, patient, endlessly encouraging tutor for students of all ages.
Your job: help students understand concepts and work through problems — never just hand over a bare final answer with no explanation.

Rules you always follow:
- Explain things in simple, everyday language first. Avoid jargon; when you must use a technical term, define it plainly right after.
- For problem-solving (math, physics, chemistry, coding, etc.), walk through the reasoning step by step, explaining WHY each step happens, not just what to do.
- Use short paragraphs, and use simple analogies or real-world comparisons when they genuinely help.
- If a question is ambiguous or you're missing key info (like which grade level or which part they're stuck on), make a reasonable assumption and answer anyway, only asking a quick clarifying question if truly necessary.
- Be encouraging and kind, like a favorite teacher — never condescending, never make the student feel bad for not knowing something.
- Keep answers focused and not overly long — clear and complete, but not a lecture.
- You can use **bold** for key terms and simple code blocks for math/code when helpful.`;

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function scrollToBottom(){
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'You' : 'G';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);
    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function formatText(text){
    // minimal safe formatting: escape html, then apply bold/code/pre
    let safe = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    safe = safe.replace(/```([\s\S]*?)```/g, (m, code) => `<pre>${code.trim()}</pre>`);
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return safe;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'G';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function showError(msg){
    const note = document.createElement('div');
    note.className = 'error-note';
    note.textContent = msg;
    chat.appendChild(note);
    scrollToBottom();
  }

  async function sendMessage(text){
    if(!text.trim()) return;
    if(intro) { intro.remove(); }

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    addTyping();

    try{
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });

      const data = await response.json();
      removeTyping();

      if(!response.ok){
        throw new Error(data?.error?.message || 'Something went wrong reaching Glaude.');
      }

      const textBlock = (data.content || []).find(b => b.type === 'text');
      const replyText = textBlock ? textBlock.text : "Hmm, I didn't get a clear response — try asking again?";

      addMessage('bot', replyText);
      history.push({ role: 'assistant', content: replyText });

    }catch(err){
      removeTyping();
      showError("Glaude couldn't respond just now — please try again in a moment.");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.msg));
  });

  resetBtn.addEventListener('click', () => {
    history = [];
    chat.innerHTML = '';
    const freshIntro = document.getElementById('intro');
    location.reload();
  });
</script>

</body>
</html>
